name: UCB-0004X Sealed Target Runner - Ubuntu 22.04 Repair

on:
  push:
    branches: [main]
    paths:
      - 'cloud/ucb0004x/runner-repair-v1.0.2.trigger.json'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  execute-sealed-target:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen scorer and execution amendments
        run: |
          echo '9dc57fe6ebdf5d92109547f1f267197d5d5caec0781562e59acfb595945df897  cloud/ucb0004x/ucb0004x_target_runner_v1.0.py' | sha256sum -c -
          echo 'd1de3c1fa482eae48cd5dc20ae2c92cdbed0738ca90ef043611709b8b746b8d5  cloud/ucb0004x/ucb0004x_target_exec_adapter_v1.0.1.py' | sha256sum -c -
          echo '727a6f5a874e0c79c168b2fbfdb5abb0a4a1bfc2b21648535ff49115ccd94e98  cloud/ucb0004x/UCB-0004X_EXECUTION_AMENDMENT_v1.0.1.md' | sha256sum -c -
          echo 'edcf7060c8241f739768f3e6b2083d4185009a97e1a9a82768ee0a73379ee09c  cloud/ucb0004x/UCB-0004X_EXECUTION_AMENDMENT_v1.0.2.md' | sha256sum -c -

      - name: Freeze execution environment record
        run: |
          python3 -m pip install --disable-pip-version-check numpy==2.1.3
          mkdir -p sealed_input sealed
          python3 - <<'PY'
          import json, platform, sys, numpy
          from pathlib import Path
          Path('sealed/EXECUTION_ENVIRONMENT.json').write_text(json.dumps({
            'python': sys.version,
            'platform': platform.platform(),
            'numpy': numpy.__version__,
            'scientific_protocol_version': '1.0',
            'execution_patch': '1.0.2',
            'runner_label': 'ubuntu-22.04',
            'frozen_runner_sha256': '9dc57fe6ebdf5d92109547f1f267197d5d5caec0781562e59acfb595945df897',
            'execution_adapter_sha256': 'd1de3c1fa482eae48cd5dc20ae2c92cdbed0738ca90ef043611709b8b746b8d5',
            'schema_amendment_sha256': '727a6f5a874e0c79c168b2fbfdb5abb0a4a1bfc2b21648535ff49115ccd94e98',
            'runner_amendment_sha256': 'edcf7060c8241f739768f3e6b2083d4185009a97e1a9a82768ee0a73379ee09c',
            'prior_failed_run_id': '36273814889',
            'prior_queued_run_id': '36275536604'
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Acquire exact authorized Zenodo files
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://zenodo.org/records/19856119/files/h1.csv?download=1' -o sealed_input/h1.csv
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://zenodo.org/records/19856119/files/h2.csv?download=1' -o sealed_input/h2.csv
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://zenodo.org/records/19856119/files/U.csv?download=1' -o sealed_input/U.csv
          cat > /tmp/MD5SUMS <<'EOF'
          978d5f00e2520180c879656a1393aea6  sealed_input/h1.csv
          98a8bfbbfc57b37b5233e8a8f5c8b9d5  sealed_input/h2.csv
          b3ce5b3db14356df6dbd8b365044ae1e  sealed_input/U.csv
          EOF
          md5sum -c /tmp/MD5SUMS
          sha256sum sealed_input/h1.csv sealed_input/h2.csv sealed_input/U.csv > sealed/INPUT_SHA256SUMS.txt

      - name: Execute frozen scorer through execution-only shape adapter
        run: |
          set -euo pipefail
          python3 cloud/ucb0004x/ucb0004x_target_exec_adapter_v1.0.1.py \
            --data-dir sealed_input \
            --output sealed/UCB-0004X_TARGET_RESULT_v1.0.json
          sha256sum sealed/UCB-0004X_TARGET_RESULT_v1.0.json > sealed/TARGET_RESULT_SHA256.txt
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def h(path, alg):
              z=hashlib.new(alg); z.update(Path(path).read_bytes()); return z.hexdigest()
          receipt={
            'experiment_id':'UCB-0004X',
            'version':'1.0',
            'execution_patch':'1.0.2',
            'runner_label':'ubuntu-22.04',
            'execution_state':'TARGET_EXECUTED_AND_SEALED',
            'source_exp0003_inspected':False,
            'target_result_sha256':h('sealed/UCB-0004X_TARGET_RESULT_v1.0.json','sha256'),
            'frozen_runner_sha256':'9dc57fe6ebdf5d92109547f1f267197d5d5caec0781562e59acfb595945df897',
            'execution_adapter_sha256':'d1de3c1fa482eae48cd5dc20ae2c92cdbed0738ca90ef043611709b8b746b8d5',
            'schema_amendment_sha256':'727a6f5a874e0c79c168b2fbfdb5abb0a4a1bfc2b21648535ff49115ccd94e98',
            'runner_amendment_sha256':'edcf7060c8241f739768f3e6b2083d4185009a97e1a9a82768ee0a73379ee09c',
            'prior_failed_run_id':'36273814889',
            'prior_queued_run_id':'36275536604',
            'inputs':{
              'h1.csv':{'md5':h('sealed_input/h1.csv','md5'),'sha256':h('sealed_input/h1.csv','sha256')},
              'h2.csv':{'md5':h('sealed_input/h2.csv','md5'),'sha256':h('sealed_input/h2.csv','sha256')},
              'U.csv':{'md5':h('sealed_input/U.csv','md5'),'sha256':h('sealed_input/U.csv','sha256')}
            },
            'github_run_id':os.environ.get('GITHUB_RUN_ID'),
            'github_sha':os.environ.get('GITHUB_SHA')
          }
          Path('sealed/UCB-0004X_TARGET_SEAL_RECEIPT_v1.0.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          echo 'UCB-0004X target execution sealed; numerical result intentionally not printed.'

      - name: Preserve sealed target artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucb0004x-target-sealed-repair-${{ github.run_id }}
          path: |
            sealed_input/h1.csv
            sealed_input/h2.csv
            sealed_input/U.csv
            sealed/UCB-0004X_TARGET_RESULT_v1.0.json
            sealed/UCB-0004X_TARGET_SEAL_RECEIPT_v1.0.json
            sealed/TARGET_RESULT_SHA256.txt
            sealed/INPUT_SHA256SUMS.txt
            sealed/EXECUTION_ENVIRONMENT.json
            cloud/ucb0004x/UCB-0004X_EXECUTION_AMENDMENT_v1.0.1.md
            cloud/ucb0004x/UCB-0004X_EXECUTION_AMENDMENT_v1.0.2.md
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
