name: LIFE-CODE Cloud Runner

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment stage
        required: true
        type: choice
        options:
          - CORPUS-RAW-VERIFY
          - CORPUS-RAW-VERIFY-ALL
          - CORPUS-NORMALIZE-VERIFY-ALL
          - EXP-0002A
          - EXP-0003-PROJECTION
      assembly_id:
        description: Frozen assembly ID for single raw verification
        required: false
        type: string
      representation:
        description: Projection for EXP-0003
        required: false
        default: ACGT
        type: choice
        options: [ACGT, RY, MK, WS]
      input_url:
        description: HTTPS URL of one frozen normalized FASTA for bounded projection chunks
        required: false
        type: string
      expected_sha256:
        description: Required SHA-256 for input_url
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'cloud/requests/*.json'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      experiment: ${{ steps.request.outputs.experiment }}
      assembly_id: ${{ steps.request.outputs.assembly_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify sealed authority constants
        run: |
          python3 - <<'PY'
          import hashlib,json
          s=json.load(open('cloud/status.json'))
          assert s['authority']['exp0002_bundle_sha256']=='76fb482a368af757a53688ef947d2a219280a2db8c3bc4d5bb5906bc6978a713'
          assert s['authority']['a3_sealed_result_sha256']=='769b21fe5f1f1caff44399eff563f1f8d29a48dcdfc1729c9a036a2eb16c7258'
          assert s['experiments']['EXP-0002']['mutable'] is False
          p='cloud/canonical/v0.1.33/exp0002_normalize_fasta.py'
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert h=='f705448fa0dfc20aed7a4a3fa3023eb79d5a1bbbcb4b75d0489a8481ca587712',h
          print('SEALED AUTHORITY + CANONICAL SOURCE GATE: PASS')
          PY
      - id: request
        name: Resolve request
        env:
          MANUAL_EXPERIMENT: ${{ inputs.experiment }}
          MANUAL_ASSEMBLY: ${{ inputs.assembly_id }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          if os.environ['EVENT_NAME']=='workflow_dispatch':
              experiment=os.environ.get('MANUAL_EXPERIMENT','')
              assembly=os.environ.get('MANUAL_ASSEMBLY','')
          else:
              before=os.environ['BEFORE_SHA']; cur=os.environ['CURRENT_SHA']
              changed=subprocess.check_output(['git','diff','--name-only',before,cur,'--','cloud/requests/*.json'],text=True).splitlines()
              if len(changed)!=1:
                  raise SystemExit(f'expected exactly one request file in commit, got {changed}')
              req=json.loads(Path(changed[0]).read_text())
              experiment=req.get('experiment','')
              assembly=req.get('assembly_id','')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'experiment={experiment}\n')
              f.write(f'assembly_id={assembly}\n')
          print('request:',experiment,assembly)
          PY

  corpus_raw_verify:
    if: ${{ needs.gate.outputs.experiment == 'CORPUS-RAW-VERIFY' }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install NCBI Datasets CLI
        run: |
          curl --fail --location --retry 3 https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o datasets
          chmod +x datasets
          sudo mv datasets /usr/local/bin/datasets
          datasets version
      - name: Reacquire and hash-gate frozen raw FASTA
        run: |
          test -n "${{ needs.gate.outputs.assembly_id }}"
          python3 cloud/scripts/reacquire_raw.py --assembly-id "${{ needs.gate.outputs.assembly_id }}" --out raw-verify-result.json
          python3 cloud/scripts/checkpoint.py --experiment CORPUS-RAW-VERIFY --chunk "${{ needs.gate.outputs.assembly_id }}" --status COMPLETE --output raw-verify-result.json --checkpoint checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: lifecode-raw-verify-${{ needs.gate.outputs.assembly_id }}-${{ github.run_id }}
          path: |
            raw-verify-result.json
            checkpoint.json
          if-no-files-found: error
          retention-days: 90

  corpus_matrix:
    if: ${{ needs.gate.outputs.experiment == 'CORPUS-RAW-VERIFY-ALL' || needs.gate.outputs.experiment == 'CORPUS-NORMALIZE-VERIFY-ALL' }}
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      assemblies: ${{ steps.matrix.outputs.assemblies }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python3 - <<'PY'
          import csv,json,os
          with open('cloud/FROZEN_CORPUS_BINDING.tsv',newline='',encoding='utf-8') as f:
              ids=[r['assembly_id'] for r in csv.DictReader(f,delimiter='\t')]
          assert len(ids)==26, len(ids)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('assemblies='+json.dumps(ids,separators=(',',':'))+'\n')
          print('frozen corpus assemblies:',len(ids))
          PY

  corpus_raw_verify_all:
    if: ${{ needs.gate.outputs.experiment == 'CORPUS-RAW-VERIFY-ALL' }}
    needs: [gate, corpus_matrix]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        assembly_id: ${{ fromJSON(needs.corpus_matrix.outputs.assemblies) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install NCBI Datasets CLI
        run: |
          curl --fail --location --retry 3 https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o datasets
          chmod +x datasets
          sudo mv datasets /usr/local/bin/datasets
      - name: Reacquire and hash-gate frozen raw FASTA
        run: |
          python3 cloud/scripts/reacquire_raw.py --assembly-id "${{ matrix.assembly_id }}" --out raw-verify-result.json
          python3 cloud/scripts/checkpoint.py --experiment CORPUS-RAW-VERIFY --chunk "${{ matrix.assembly_id }}" --status COMPLETE --output raw-verify-result.json --checkpoint checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: lifecode-raw-verify-${{ matrix.assembly_id }}-${{ github.run_id }}
          path: |
            raw-verify-result.json
            checkpoint.json
          if-no-files-found: error
          retention-days: 90

  corpus_normalize_verify_all:
    if: ${{ needs.gate.outputs.experiment == 'CORPUS-NORMALIZE-VERIFY-ALL' }}
    needs: [gate, corpus_matrix]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        assembly_id: ${{ fromJSON(needs.corpus_matrix.outputs.assemblies) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install NCBI Datasets CLI
        run: |
          curl --fail --location --retry 3 https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o datasets
          chmod +x datasets
          sudo mv datasets /usr/local/bin/datasets
      - name: Reacquire exact frozen raw FASTA
        run: |
          python3 cloud/scripts/reacquire_raw.py --assembly-id "${{ matrix.assembly_id }}" --work work --out raw-verify-result.json
      - name: Run exact canonical v0.1.33 normalizer and verify both frozen output hashes
        run: |
          python3 cloud/scripts/verify_canonical_normalization.py --assembly-id "${{ matrix.assembly_id }}" --work work --out normalization-verify-result.json
          python3 cloud/scripts/checkpoint.py --experiment CORPUS-NORMALIZE-VERIFY --chunk "${{ matrix.assembly_id }}" --status COMPLETE --output raw-verify-result.json --output normalization-verify-result.json --checkpoint checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: lifecode-normalize-verify-${{ matrix.assembly_id }}-${{ github.run_id }}
          path: |
            raw-verify-result.json
            normalization-verify-result.json
            checkpoint.json
          if-no-files-found: error
          retention-days: 90

  projection_chunk:
    if: ${{ needs.gate.outputs.experiment == 'EXP-0003-PROJECTION' && github.event_name == 'workflow_dispatch' }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require immutable input binding
        run: |
          test -n "${{ inputs.input_url }}"
          test -n "${{ inputs.expected_sha256 }}"
      - name: Acquire bounded input
        run: curl --fail --location --retry 3 "${{ inputs.input_url }}" -o input.normalized.fasta
      - name: Verify input and project
        run: |
          python3 cloud/scripts/projection.py input.normalized.fasta projected.fasta --representation "${{ inputs.representation }}" --expected-input-sha256 "${{ inputs.expected_sha256 }}" > projection-result.json
          python3 cloud/scripts/checkpoint.py --experiment EXP-0003 --chunk "projection-${{ inputs.representation }}" --status COMPLETE --output projected.fasta --output projection-result.json --checkpoint checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: lifecode-${{ inputs.representation }}-${{ github.run_id }}
          path: |
            projected.fasta
            projection-result.json
            checkpoint.json
          if-no-files-found: error
          retention-days: 90

  exp0002a_gate:
    if: ${{ needs.gate.outputs.experiment == 'EXP-0002A' }}
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block until full canonical normalization equivalence is recorded
        run: |
          echo 'EXP-0002A remains gated until CORPUS-NORMALIZE-VERIFY-ALL passes 26/26.'
          exit 78
