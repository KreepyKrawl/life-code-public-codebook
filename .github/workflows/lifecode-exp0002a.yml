name: LIFE-CODE EXP-0002A A3 Forensics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/requests/exp0002a*.json'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  fold_forensics:
    strategy:
      fail-fast: false
      matrix:
        fold: [AB_C, AC_B, BC_A]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Verify cloud corpus gate
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open('cloud/status.json'))
          c=s['corpus']
          assert c['canonical_normalization_verified']==26
          assert c['canonical_normalization_failed']==0
          assert s['experiments']['EXP-0002A']['state']=='READY_FOR_CLOUD_FORENSICS'
          print('EXP-0002A CORPUS GATE: PASS')
          PY

      - name: Install NCBI Datasets CLI
        run: |
          curl --fail --location --retry 3 https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o datasets
          chmod +x datasets
          sudo mv datasets /usr/local/bin/datasets

      - name: Build exact MUMmer 4.0.1
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool zlib1g-dev
          curl --fail --location --retry 3 https://github.com/mummer4/mummer/releases/download/v4.0.1/mummer-4.0.1.tar.gz -o mummer-4.0.1.tar.gz
          tar -xzf mummer-4.0.1.tar.gz
          cd mummer-4.0.1
          ./configure --prefix="$HOME/mummer4"
          make -j2
          make install
          echo "MUMMER_EXE=$HOME/mummer4/bin/mummer" >> "$GITHUB_ENV"

      - name: Reacquire and canonically normalize A3 genomes
        run: |
          set -euo pipefail
          for id in A_HSAP A_GGAL A_DRER; do
            python3 cloud/scripts/reacquire_raw.py --assembly-id "$id" --work "work/$id" --out "raw-$id.json"
            python3 cloud/scripts/verify_canonical_normalization.py --assembly-id "$id" --work "work/$id" --out "norm-$id.json"
            rm -f "work/$id/$id.zip"
            rm -rf "work/$id/package"
          done

      - name: Recover one A3 299-bp forensic fold
        run: |
          python3 cloud/scripts/exp0002a_a3_299_forensics.py \
            --human work/A_HSAP/canonical_normalization/A_HSAP.normalized.fasta \
            --chicken work/A_GGAL/canonical_normalization/A_GGAL.normalized.fasta \
            --zebrafish work/A_DRER/canonical_normalization/A_DRER.normalized.fasta \
            --fold "${{ matrix.fold }}" \
            --work "forensic-work-${{ matrix.fold }}" \
            --out "fold-${{ matrix.fold }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: lifecode-exp0002a-fold-${{ matrix.fold }}-${{ github.run_id }}
          path: fold-${{ matrix.fold }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: fold_forensics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lifecode-exp0002a-fold-*-${{ github.run_id }}
          path: fold-results
          merge-multiple: true
      - name: Aggregate three frozen folds
        run: |
          python3 - <<'PY'
          import glob,json,hashlib
          files=sorted(glob.glob('fold-results/fold-*.json'))
          assert len(files)==3,files
          docs=[json.load(open(p)) for p in files]
          folds=[]
          for d in docs:
              assert d['status']=='COMPLETE'
              assert len(d['folds'])==1
              folds.extend(d['folds'])
          order={'AB_C':0,'AC_B':1,'BC_A':2};folds.sort(key=lambda x:order[x['fold']])
          sets=[{w['sequence_sha256'] for w in f['winners']} for f in folds]
          common=set.intersection(*sets)
          out={
            'schema':'LIFE_CODE_EXP0002A_A3_299_FORENSICS_AGGREGATE_V1',
            'status':'COMPLETE',
            'method_state':'POST_FREEZE_FORENSIC_DERIVATIVE_OF_CANONICAL_LONGEST_BLOCK',
            'canonical_longest_block_wrapper_sha256_reference':'f3b9fb457a4ee11fe41af70962b7d268f4f12ef22e2441b20160379c9208db5e',
            'threshold':256,'target_length':299,'folds':folds,
            'winner_counts':{f['fold']:f['winner_count'] for f in folds},
            'sequence_hashes_common_to_all_three_folds':sorted(common),
            'same_299_sequence_present_in_all_three_folds':bool(common)
          }
          raw=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode()
          open('EXP0002A_A3_299_FORENSICS.json','wb').write(raw)
          open('EXP0002A_A3_299_FORENSICS.sha256','w').write(hashlib.sha256(raw).hexdigest()+'  EXP0002A_A3_299_FORENSICS.json\n')
          print(json.dumps({'winner_counts':out['winner_counts'],'common_sequence_count':len(common)},sort_keys=True))
          PY
          python3 cloud/scripts/checkpoint.py \
            --experiment EXP-0002A \
            --chunk A3-299-FORENSICS \
            --status COMPLETE \
            --output EXP0002A_A3_299_FORENSICS.json \
            --output EXP0002A_A3_299_FORENSICS.sha256 \
            --checkpoint checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: lifecode-exp0002a-a3-299-${{ github.run_id }}
          path: |
            EXP0002A_A3_299_FORENSICS.json
            EXP0002A_A3_299_FORENSICS.sha256
            checkpoint.json
          if-no-files-found: error
          retention-days: 90
