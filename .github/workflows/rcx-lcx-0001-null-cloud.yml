name: RCX-LCX-0001 Prevalence Null

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/requests/rcx-lcx-0001-null-*.json'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  prevalence_null:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Verify null request when push-triggered
        if: ${{ github.event_name == 'push' }}
        run: |
          python3 - <<'PY'
          import json,glob
          files=glob.glob('cloud/requests/rcx-lcx-0001-null-*.json')
          if not files: raise SystemExit('missing null request')
          req=json.load(open(sorted(files)[-1]))
          assert req.get('experiment')=='RCX-LCX-0001'
          assert req.get('stage')=='A_PREVALENCE_MATCHED_NULL'
          print('REQUEST PASS',req)
          PY
      - name: Install NCBI Datasets CLI
        run: |
          curl --fail --location --retry 3 https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o datasets
          chmod +x datasets
          sudo mv datasets /usr/local/bin/datasets
          datasets version
      - name: Execute prevalence-matched null
        run: python3 cloud/scripts/rcx_lcx_0001_prevalence_null.py
      - name: Write checkpoint
        if: ${{ success() }}
        run: |
          python3 cloud/scripts/checkpoint.py \
            --experiment RCX-LCX-0001 \
            --chunk STAGE-A-PREVALENCE-MATCHED-NULL \
            --status COMPLETE \
            --output rcx-lcx-0001-prevalence-null.json \
            --output rcx-lcx-0001-prevalence-null-sha256.txt \
            --checkpoint rcx-lcx-0001-prevalence-null-checkpoint.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: rcx-lcx-0001-prevalence-null-${{ github.run_id }}
          path: |
            rcx-lcx-0001-prevalence-null.json
            rcx-lcx-0001-prevalence-null-sha256.txt
            rcx-lcx-0001-prevalence-null-checkpoint.json
          if-no-files-found: warn
          retention-days: 90
