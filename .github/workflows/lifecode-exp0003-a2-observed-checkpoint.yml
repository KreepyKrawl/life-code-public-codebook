          GA: ${{ needs.gate.outputs.genome_a }}
          GB: ${{ needs.gate.outputs.genome_b }}
          GC: ${{ needs.gate.outputs.genome_c }}
          REP: ${{ matrix.representation }}
          FOLD: ${{ matrix.fold }}
        run: |
          rm -rf result work
          mkdir -p result work
          PYTHONPATH=cloud/scripts python3 cloud/scripts/exp0003_observed_checkpoint_a2.py \
