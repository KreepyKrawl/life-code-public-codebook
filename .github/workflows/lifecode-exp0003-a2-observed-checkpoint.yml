    if: ${{ always() }}
    needs: [gate,prepare,qualify,finalize]
    runs-on: ubuntu-latest
    steps:
      - name: Record execution state only
        env:
          TID: ${{ needs.gate.outputs.triad_id }}
          GROUP: ${{ needs.gate.outputs.group }}
          PREP: ${{ needs.prepare.result }}
          QUAL: ${{ needs.qualify.result }}
          FINAL: ${{ needs.finalize.result }}
        run: |
          echo "triad=$TID group=$GROUP prepare=$PREP qualify=$QUAL finalize=$FINAL"
          test "$PREP" = "success"
          test "$QUAL" = "success"
          test "$FINAL" = "success"
