name: LIFE-CODE EXP-0003 A2 OBS Checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'cloud/requests/exp0003-a2-obs-group-*.json'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  A2_CACHE_KEY: exp0003-a3-prepared-c754b105a7a9d7be1fe5a694c00f4fc0611e90601dc89b676e2716e744807cdc

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      triad_id: ${{ steps.req.outputs.triad_id }}
      group: ${{ steps.req.outputs.group }}
      representations: ${{ steps.req.outputs.representations }}
      genome_a: ${{ steps.req.outputs.genome_a }}
      genome_b: ${{ steps.req.outputs.genome_b }}
      genome_c: ${{ steps.req.outputs.genome_c }}
      source_run_id: ${{ steps.req.outputs.source_run_id }}
      source_artifact_name: ${{ steps.req.outputs.source_artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: req
        name: Resolve and freeze A2 request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import csv,json,os,subprocess
          from pathlib import Path

          changed=subprocess.check_output([
              'git','diff','--name-only',os.environ['BEFORE_SHA'],os.environ['CURRENT_SHA'],
              '--','cloud/requests/exp0003-a2-obs-group-*.json'
          ],text=True).splitlines()
          if len(changed)!=1:
              raise SystemExit(f'expected one A2 request, got {changed}')
          req=json.loads(Path(changed[0]).read_text())

          required={
            'amendment_git_blob':'cloud/protocols/EXP-0003_EXECUTION_AMENDMENT_A2_v1.0.md',
            'executor_git_blob':'cloud/scripts/exp0003_observed_checkpoint_a2.py',
            'finalizer_git_blob':'cloud/scripts/exp0003_observed_finalize_a2.py',
            'workflow_git_blob':'.github/workflows/lifecode-exp0003-a2-observed-checkpoint.yml',
          }
          for field,path in required.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if actual!=req.get(field):
                  raise SystemExit(f'{field} mismatch: {actual} != {req.get(field)}')

          frozen={
            'cloud/scripts/exp0003_engine.py':'2ac8e1e2a8bdbde8046cd62b2f7088f68322f851',
            'cloud/scripts/exp0003_triad_transfer_prod.py':'8ca50c93ef462c30f4b287bb5fcf66213895a3ed',
            'cloud/protocols/EXP-0003_PRIMARY_EXECUTION_RESOURCE_PLAN_v1.0.md':'ee0afb87bc9b2219d386a571de6770e57e154924',
          }
          for path,expected in frozen.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if actual!=expected:
                  raise SystemExit(f'frozen blob changed: {path}: {actual}')

          s=json.load(open('cloud/status.json'))
          assert s['corpus']['canonical_normalization_verified']==26
          assert s['runner']['exp0003_n1_replicates']==99
          assert s['runner']['exp0003_production_engine_qualification'].startswith('PASS_')
          assert s['experiments']['EXP-0003']['primary_outcomes_inspected'] is False

          reps=req.get('representations')
          allowed=['ACGT','RY','MK','WS']+[f'C{i:02d}' for i in range(1,13)]
          if not isinstance(reps,list) or not 1<=len(reps)<=2 or len(set(reps))!=len(reps):
              raise SystemExit('A2 request must contain one or two unique representations')
          if any(r not in allowed for r in reps):
              raise SystemExit(f'invalid representation group {reps}')

          tid=req['triad_id']
          if tid!='A3':
              raise SystemExit('A2 amendment is frozen for A3 OBS only')
          rows=list(csv.DictReader(open('cloud/canonical/v0.1.33/EXP0002_TRIADS.csv',newline='',encoding='utf-8')))
          row=next((r for r in rows if r['triad_id']==tid),None)
          if row is None:
              raise SystemExit(f'unknown frozen triad {tid}')
          if req['source_prepared_digest']!='sha256:c754b105a7a9d7be1fe5a694c00f4fc0611e90601dc89b676e2716e744807cdc':
              raise SystemExit('unexpected source prepared digest')

          with open(os.environ['GITHUB_OUTPUT'],'a') as o:
              o.write(f'triad_id={tid}\n')
              o.write(f'group={req["group"]}\n')
              o.write('representations='+json.dumps(reps,separators=(',',':'))+'\n')
              o.write(f'genome_a={row["genome_1"]}\n')
              o.write(f'genome_b={row["genome_2"]}\n')
              o.write(f'genome_c={row["genome_3"]}\n')
              o.write(f'source_run_id={req["source_prepared_run_id"]}\n')
              o.write(f'source_artifact_name={req["source_prepared_artifact"]}\n')
          print('EXP-0003 A2 REQUEST GATE: PASS',tid,req['group'])
          PY

  prepare:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: prepared
          key: ${{ env.A2_CACHE_KEY }}

      - name: Recover original verified A3 prepared bundle
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gate.outputs.source_artifact_name }}
          path: prepared
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.gate.outputs.source_run_id }}

      - name: Reverify normalized FASTA hashes
        env:
          GA: ${{ needs.gate.outputs.genome_a }}
          GB: ${{ needs.gate.outputs.genome_b }}
          GC: ${{ needs.gate.outputs.genome_c }}
        run: |
          python3 - <<'PY'
          import csv,hashlib,json,os
          from pathlib import Path
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          rows={r['assembly_id']:r for r in csv.DictReader(open('cloud/FROZEN_CORPUS_BINDING.tsv',newline='',encoding='utf-8'),delimiter='\t')}
          manifest=json.load(open('prepared/PREPARED_MANIFEST.json'))
          for ID in [os.environ['GA'],os.environ['GB'],os.environ['GC']]:
              p=Path('prepared')/f'{ID}.fasta'
              got=sha(p)
              expected=rows[ID]['normalized_fasta_sha256']
              assert got==expected,(ID,got,expected)
              assert manifest[f'{ID}.fasta']==expected
          assert Path('prepared/mummer4.tar.gz').is_file()
          print('A2 PREPARED HASH GATE: PASS')
          PY

      - name: Save verified prepared bundle to operational cache
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: prepared
          key: ${{ env.A2_CACHE_KEY }}

  qualify:
    needs: [gate,prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: prepared
          key: ${{ env.A2_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Restore exact MUMmer 4.0.1
        run: |
          tar -xzf prepared/mummer4.tar.gz
          echo "MUMMER_EXE=$GITHUB_WORKSPACE/mummer4/bin/mummer" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE/mummer4/bin/mummer" --version

      - name: Frozen uninterrupted versus A2 checkpoint parity
        run: |
          PYTHONPATH=cloud/scripts python3 - <<'PY'
          from pathlib import Path
          import shutil,tempfile
          import exp0003_triad_transfer_prod as frozen
          import exp0003_observed_checkpoint_a2 as a2

          root=Path(tempfile.mkdtemp(prefix='exp0003-a2-parity-'))
          try:
              cases=[
                (
                  '>a\nAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\n',
                  '>b\nCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC\n',
                  '>h\nGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG\n',
                ),
                (
                  '>a\nAAAACCCCGGGGTTTTAAAACCCCGGGGTTTT\n',
                  '>b\nTTTTAAAACCCCGGGGTTTTAAAACCCCGGGG\n',
                  '>h\nGGGGAAAACCCCGGGGTTTTCCCCAAAATTTT\n',
                ),
              ]
              for i,(sa,sb,sh) in enumerate(cases):
                  A=root/f'A{i}.fa';B=root/f'B{i}.fa';H=root/f'H{i}.fa'
                  A.write_text(sa);B.write_text(sb);H.write_text(sh)
                  serial_v,serial_d=frozen.score_fold(
                      A,B,H,'ACGT','PARITY','AB_C',None,root/f'serial{i}'
                  )
                  state=None
                  step=0
                  while state is None or not state['complete']:
                      state=a2.advance(
                          A,B,H,'ACGT','PARITY','AB_C',
                          root/f'checkpoint{i}_{step}',
                          state=state,max_thresholds=1
                      )
                      step+=1
                      if step>64:
                          raise SystemExit('A2 parity checkpoint did not terminate')
                  if (serial_v,serial_d)!=(state['Lstar'],state['detail']):
                      raise SystemExit(f'A2 PARITY FAIL case={i}')
              print('EXP-0003 A2 PARITY: PASS cases=2')
          finally:
              shutil.rmtree(root,ignore_errors=True)
          PY

  stage01:
    if: ${{ always() && needs.gate.result == 'success' && needs.prepare.result == 'success' && needs.qualify.result == 'success' }}
