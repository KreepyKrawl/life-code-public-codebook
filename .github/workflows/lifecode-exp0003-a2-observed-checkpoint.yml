            --representation "$REP" --triad-id "$TID" --fold "$FOLD" \
            --max-thresholds 2 \
            --work "work/$REP/$FOLD/s01" \
            --out "result/state.json"

      - uses: actions/upload-artifact@v4
        with:
          name: exp0003-a2-${{ needs.gate.outputs.triad_id }}-${{ needs.gate.outputs.group }}-${{ matrix.representation }}-${{ matrix.fold }}-s01-${{ github.run_id }}
