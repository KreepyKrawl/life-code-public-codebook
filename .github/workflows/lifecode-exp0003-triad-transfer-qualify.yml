name: LIFE-CODE EXP-0003 Full Triad Transfer Qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/requests/exp0003-triad-transfer-qualify*.json'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  qualify-full-triad-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen pre-primary gates
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open('cloud/status.json'))
          assert s['authority']['exp0002_state']=='SEALED_COMPLETE'
          assert s['runner']['exp0003_exact_triad_binding']=='PASS'
          assert s['runner']['exp0003_n1_replicates']==99
          assert s['runner']['exp0003_seed_schedule']=='FROZEN_SHA256_CELL_SPECIFIC'
          print('EXP-0003 FULL TRIAD QUALIFICATION PRE-GATE: PASS')
          PY
      - name: Verify frozen protocol files exist
        run: |
          test -f cloud/protocols/EXP-0003_PHYLOGENETIC_QUOTIENT_TRANSFER_PREREG_v1.0.md
          test -f cloud/protocols/EXP-0003_CONTROL_FAMILY_FREEZE_v1.0.md
          test -f cloud/protocols/EXP-0003_N1_EXECUTION_QUALIFICATION_FREEZE_v1.0.md
          test -f cloud/protocols/EXP-0003_ORIENTATION_TRANSFER_SEMANTICS_FREEZE_v1.0.md
          test -f cloud/protocols/EXP-0003_N1_ORIENTATION_SEMANTICS_FREEZE_v1.0.md
      - name: Build exact MUMmer 4.0.1
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool zlib1g-dev
          curl --fail --location --retry 3 https://github.com/mummer4/mummer/releases/download/v4.0.1/mummer-4.0.1.tar.gz -o mummer-4.0.1.tar.gz
          tar -xzf mummer-4.0.1.tar.gz
          cd mummer-4.0.1
          ./configure --prefix="$HOME/mummer4"
          make -j2
          make install
          echo "MUMMER_EXE=$HOME/mummer4/bin/mummer" >> "$GITHUB_ENV"
      - name: Run independent full-triad synthetic oracle qualification
        run: |
          PYTHONPATH=cloud/scripts python3 cloud/scripts/exp0003_triad_transfer_qualify.py
      - uses: actions/upload-artifact@v4
        with:
          name: lifecode-exp0003-full-triad-transfer-qualification-${{ github.run_id }}
          path: exp0003-triad-transfer-qualification.json
          if-no-files-found: error
          retention-days: 90
