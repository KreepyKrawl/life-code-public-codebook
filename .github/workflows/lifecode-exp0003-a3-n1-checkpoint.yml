          GA: ${{ needs.gate.outputs.genome_a }}
          GB: ${{ needs.gate.outputs.genome_b }}
          GC: ${{ needs.gate.outputs.genome_c }}
          REP: ${{ matrix.representation }}
          FOLD: ${{ matrix.fold }}
          N: ${{ matrix.replicate }}
        run: |
          rm -rf result work
          mkdir -p result work
          PYTHONPATH=cloud/scripts python3 cloud/scripts/exp0003_n1_checkpoint_a3.py \
            --a "prepared/$GA.fasta" --b "prepared/$GB.fasta" --c "prepared/$GC.fasta" \
            --representation "$REP" --triad-id "$TID" --fold "$FOLD" --replicate "$N" \
            --workers 3 --thresholds 4 --work "work/$REP/$FOLD/r$N/s01" --out result/state.json
      - uses: actions/upload-artifact@v4
        with:
          name: exp0003-a3-${{ needs.gate.outputs.group }}-${{ matrix.representation }}-${{ matrix.fold }}-r${{ matrix.replicate }}-s01-${{ github.run_id }}
          path: result/state.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

