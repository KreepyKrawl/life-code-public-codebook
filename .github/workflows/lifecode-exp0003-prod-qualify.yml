name: LIFE-CODE EXP-0003 Production Engine Qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/requests/exp0003-prod-qualify*.json'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  qualify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify no primary outcome has been inspected
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open('cloud/status.json'))
          assert s['experiments']['EXP-0003']['primary_outcomes_inspected'] is False
          assert s['runner']['exp0003_full_triad_transfer_qualification'].startswith('PASS_')
          assert s['runner']['exp0003_n1_replicates']==99
          print('EXP-0003 PRODUCTION QUALIFICATION PRE-GATE: PASS')
          PY
      - name: Build exact MUMmer 4.0.1
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool zlib1g-dev
          curl --fail --location --retry 3 https://github.com/mummer4/mummer/releases/download/v4.0.1/mummer-4.0.1.tar.gz -o mummer-4.0.1.tar.gz
          tar -xzf mummer-4.0.1.tar.gz
          cd mummer-4.0.1
          ./configure --prefix="$HOME/mummer4"
          make -j2
          make install
          echo "MUMMER_EXE=$HOME/mummer4/bin/mummer" >> "$GITHUB_ENV"
      - name: Qualify production scorer and N1 orientation generator
        run: |
          PYTHONPATH=cloud/scripts python3 cloud/scripts/exp0003_prod_qualify.py
      - uses: actions/upload-artifact@v4
        with:
          name: lifecode-exp0003-production-qualification-${{ github.run_id }}
          path: exp0003-production-qualification.json
          if-no-files-found: error
          retention-days: 90
